<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>personal_chat_ver1 전체 파이프라인 테스터</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e6e6; --muted:#8a8f98;
    --blue:#4c8dff; --green:#3ecf8e; --red:#ff5c5c; --amber:#ffb020;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
         background:var(--bg); color:var(--text); }
  header { padding:20px 32px; border-bottom:1px solid var(--border); display:flex;
           justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; }
  header h1 { font-size:18px; margin:0; }
  header p { margin:6px 0 0; color:var(--muted); font-size:13px; }
  header a { color:var(--blue); font-size:13px; text-decoration:none; }
  header a:hover { text-decoration:underline; }
  main { max-width:1000px; margin:0 auto; padding:24px 32px 80px; }
  h2 { font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:32px 0 12px; }
  h2:first-child { margin-top:0; }
  h3 { font-size:14px; margin:0 0 10px; }
  section.panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:20px; }
  .muted { color:var(--muted); }

  .field-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px 20px; margin-bottom:8px; }
  .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .field input, .field select { width:100%; background:#12151b; color:var(--text); border:1px solid var(--border);
                                 border-radius:6px; padding:8px 10px; font-size:13px; }
  .field input[type="checkbox"] { width:auto; }
  details summary { cursor:pointer; color:var(--muted); font-size:13px; margin-top:14px; }
  textarea#rawJsonOverlay { width:100%; min-height:140px; margin-top:8px; background:#12151b;
    color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px;
    font-family:ui-monospace, monospace; font-size:12px; }
  button { background:var(--blue); color:#fff; border:none; border-radius:6px; padding:10px 18px;
           font-size:14px; cursor:pointer; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button:hover:not(:disabled) { opacity:.9; }

  #transcript { display:flex; flex-direction:column; gap:14px; max-height:520px; overflow-y:auto; padding:8px 2px; }
  .msg-row { display:flex; flex-direction:column; max-width:75%; }
  .msg-row.user { align-self:flex-end; align-items:flex-end; }
  .msg-row.coach, .msg-row.error { align-self:flex-start; align-items:flex-start; }
  .bubble { border-radius:10px; padding:12px 14px; white-space:pre-wrap; line-height:1.5; font-size:14px; }
  .bubble.user { background:#1d2733; border:1px solid #2c3c4f; }
  .bubble.coach { background:#1d2b22; border:1px solid #2c4a37; }
  .bubble.error { background:#2b1d1d; border:1px solid #4a2c2c; color:var(--red); }
  .branch-badge { font-size:10px; text-transform:uppercase; letter-spacing:.04em; border:1px solid;
                  border-radius:10px; padding:1px 8px; margin-bottom:4px; font-family:ui-monospace, monospace; }
  textarea#msgInput { flex:1; min-height:50px; background:#12151b; color:var(--text);
                       border:1px solid var(--border); border-radius:8px; padding:10px; font-size:14px;
                       font-family:inherit; resize:vertical; }
</style>
</head>
<body>
<header>
  <div>
    <h1>personal_chat_ver1 — 전체 파이프라인 테스터</h1>
    <p>가상 프로필로 세션을 시작해 실제 대화(의도 분류 → 루틴 생성/피드백/잡담 라우팅)를 테스트합니다.</p>
  </div>
  <a href="/">← CHAT 전용 테스터</a>
</header>
<main>

  <h2>1. 회원 프로필</h2>
  <section class="panel">
    <div id="profileForm"></div>
    <details>
      <summary>고급 · 원본 JSON (pb_50m, target_event, injury_notes 등 — 위 폼에 없는 필드)</summary>
      <textarea id="rawJsonOverlay">{
  "pb_50m": {"free": null, "back": null, "breast": null, "fly": null},
  "target_event": null, "target_time_sec": null,
  "avg_session_distance_m": null, "injury_notes": null, "pregnant": null,
  "indoor_outdoor": null, "has_partner": null, "available_days": []
}</textarea>
    </details>
    <div style="margin-top:14px;">
      <button onclick="startSession()">세션 시작 / 초기화</button>
      <span id="sessionStatus" class="muted" style="margin-left:10px; font-size:13px;"></span>
    </div>
  </section>

  <h2>2. 채팅</h2>
  <section class="panel">
    <div id="transcript"></div>
    <div style="display:flex; gap:8px; margin-top:14px;">
      <textarea id="msgInput" disabled placeholder="세션을 먼저 시작하세요"></textarea>
      <button id="sendBtn" disabled onclick="sendMessage()">전송</button>
    </div>
  </section>

  <h2>3. last_result (CLI 'json' 커맨드와 동일)</h2>
  <section class="panel">
    <pre id="lastResultPanel" style="max-height:400px; overflow:auto; background:#0d0f13; padding:12px;
      border-radius:8px; font-size:12px; margin:0;">(아직 생성된 세션 없음)</pre>
  </section>
</main>
<script>
// personal_chat_ver1.py __main__의 샘플 프로필과 동일한 값으로 시작 + 나머지 필드는 null/빈값.
const DEFAULT_PROFILE = {
  pb_50m: { free: null, back: null, breast: null, fly: null },
  css_pace_sec_per_100m: 95,
  weekly_frequency: 3, goal_type: "RECORD", target_event_date: "2026-10-01",
  target_event: null, target_time_sec: null,
  age: 34, activity_level: "REGULAR", has_symptoms_or_disease: false,
  desired_intensity: "VIGOROUS", pool_length_m: 25, session_duration_min: 60,
  equipment: "", rpe_calibration: 7,
  avg_session_distance_m: null, injury_notes: null, pregnant: null,
  indoor_outdoor: null, has_partner: null, available_days: [],
};

// 여기 나열된 키만 전용 위젯을 갖는다. 나머지는 "고급 JSON" textarea에서만
// 편집한다 — 한 필드가 두 곳에서 동시에 편집되는 경우는 없다.
const FORM_FIELDS = [
  { section: "A. 기록·피트니스", key: "css_pace_sec_per_100m", label: "CSS 페이스 (초/100m, 모르면 비움)", type: "number" },
  { section: "A. 기록·피트니스", key: "weekly_frequency", label: "주당 훈련 횟수", type: "number" },
  { section: "B. 목표", key: "goal_type", label: "목표 유형", type: "select",
    options: ["FITNESS", "RECORD", "COMPETITION", "TECHNIQUE", "REHAB"] },
  { section: "B. 목표", key: "target_event_date", label: "목표 대회 날짜 (goal_type=COMPETITION일 때만 의미 있음)", type: "date" },
  { section: "C. 신체·안전 (ACSM)", key: "age", label: "나이", type: "number" },
  { section: "C. 신체·안전 (ACSM)", key: "activity_level", label: "활동 수준", type: "select",
    options: ["INACTIVE", "REGULAR"] },
  { section: "C. 신체·안전 (ACSM)", key: "has_symptoms_or_disease", label: "심혈관·대사·신장 질환/증상 여부", type: "checkbox" },
  { section: "C. 신체·안전 (ACSM)", key: "desired_intensity", label: "희망 강도", type: "select",
    options: ["LIGHT_MODERATE", "VIGOROUS"] },
  { section: "D. 환경·제약", key: "pool_length_m", label: "풀 길이(m)", type: "select", options: [25, 50] },
  { section: "D. 환경·제약", key: "session_duration_min", label: "세션 시간(분)", type: "number" },
  { section: "D. 환경·제약", key: "equipment", label: "보유 장비(자유 기술)", type: "text" },
  { section: "E. 캘리브레이션", key: "rpe_calibration", label: "RPE 캘리브레이션 (0-10)", type: "number" },
];

function renderProfileForm() {
  const bySection = {};
  for (const f of FORM_FIELDS) (bySection[f.section] ??= []).push(f);
  const host = document.getElementById('profileForm');
  host.innerHTML = Object.entries(bySection).map(([section, fields]) => `
    <h3>${section}</h3>
    <div class="field-grid">
      ${fields.map(f => `
        <div class="field">
          <label for="field-${f.key}">${f.label}</label>
          ${renderInput(f)}
        </div>`).join('')}
    </div>`).join('');
}

function renderInput(f) {
  const val = DEFAULT_PROFILE[f.key];
  if (f.type === "select") {
    return `<select id="field-${f.key}">${f.options.map(o =>
      `<option value="${o}" ${String(o) === String(val) ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
  }
  if (f.type === "checkbox") {
    return `<input type="checkbox" id="field-${f.key}" ${val ? 'checked' : ''}>`;
  }
  return `<input type="${f.type}" id="field-${f.key}" value="${val ?? ''}">`;
}

function collectProfile() {
  let overlay;
  try {
    overlay = JSON.parse(document.getElementById('rawJsonOverlay').value || "{}");
  } catch (e) {
    alert("고급 JSON 파싱 오류: " + e.message);
    throw e;
  }
  const profile = { ...DEFAULT_PROFILE, ...overlay };
  for (const f of FORM_FIELDS) {
    const el = document.getElementById('field-' + f.key);
    if (f.type === "checkbox") profile[f.key] = el.checked;
    else if (f.type === "number") profile[f.key] = el.value === "" ? null : Number(el.value);
    else profile[f.key] = el.value === "" ? null : el.value;
  }
  return profile;
}

let sessionId = null;

async function startSession() {
  let profile;
  try { profile = collectProfile(); } catch (e) { return; }
  const res = await fetch('/api/chat/start', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ profile, session_id: sessionId }),
  });
  const data = await res.json();
  sessionId = data.session_id;
  document.getElementById('sessionStatus').textContent = `세션 시작됨 — id: ${sessionId}`;
  document.getElementById('transcript').innerHTML = '';
  document.getElementById('msgInput').disabled = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('lastResultPanel').textContent = '(아직 생성된 세션 없음)';
}

const BRANCH_STYLE = {
  GENERATE_SESSION: { label: 'GENERATE_SESSION', color: 'var(--blue)' },
  SLOT_QUESTION:    { label: 'SLOT_QUESTION (정보 부족)', color: 'var(--amber)' },
  FEEDBACK:         { label: 'FEEDBACK', color: 'var(--green)' },
  CHAT:             { label: 'CHAT', color: 'var(--muted)' },
};

function escapeHtml(s) { return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function appendBubble(role, text, branch) {
  const wrap = document.createElement('div');
  wrap.className = 'msg-row ' + role;
  const style = BRANCH_STYLE[branch] || {};
  const badge = branch
    ? `<span class="branch-badge" style="color:${style.color || 'var(--muted)'}; border-color:${style.color || 'var(--muted)'};">${style.label || branch}</span>`
    : '';
  wrap.innerHTML = `${badge}<div class="bubble ${role}">${escapeHtml(text)}</div>`;
  document.getElementById('transcript').appendChild(wrap);
  wrap.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

// 전송 중 중복 호출 방지 — Enter를 연타하거나 Enter+버튼 클릭이 겹쳐도
// sendMessage()가 두 번 이상 겹쳐 실행되지 않게 막는 가드.
let isSending = false;

async function sendMessage() {
  if (isSending) return;
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !sessionId) return;
  isSending = true;
  appendBubble('user', text, null);
  input.value = '';
  document.getElementById('sendBtn').disabled = true;

  let data;
  try {
    const res = await fetch('/api/chat/message', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
  } catch (e) {
    appendBubble('error', '오류: ' + e.message, null);
    isSending = false;
    document.getElementById('sendBtn').disabled = false;
    return;
  }

  appendBubble('coach', data.reply, data.branch);
  document.getElementById('lastResultPanel').textContent =
    data.last_result ? JSON.stringify(data.last_result, null, 2) : '(아직 생성된 세션 없음)';
  isSending = false;
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}

document.addEventListener('DOMContentLoaded', () => {
  renderProfileForm();
  document.getElementById('msgInput').addEventListener('keydown', (e) => {
    // 한글/일본어/중국어 IME로 조합 중일 때(예: "안녕" 입력 중 조합 확정을
    // 위해 Enter를 누르는 순간)도 keydown Enter 이벤트가 발생한다. 이걸
    // 걸러내지 않으면 조합이 끝나기 전에 메시지가 잘려서 한 번 전송되고,
    // 실제로 전송하려던 Enter가 또 한 번 인식돼 총 두 번(예: "안녕"과
    // "녕") 보내지고 응답도 두 번 온다. e.isComposing과 구형 브라우저 호환용
    // keyCode 229 둘 다 체크해서 조합 중인 Enter는 무시한다.
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      sendMessage();
    }
  });
});
</script>
</body>
</html>
